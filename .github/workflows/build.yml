name: build
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: wmcbrine/PDCurses
          path: PDCurses

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            zip

      - name: Build PDCurses
        run: |
          mkdir -p pdobj
          for f in PDCurses/pdcurses/*.c PDCurses/wincon/*.c; do
            gcc -c -O2 -I PDCurses -I PDCurses/wincon "$f" -o pdobj/$(basename "$f" .c).o
          done
          ar rcs pdcurses.a pdobj/*.o

      - name: Build game
        run: g++ main.cpp pdcurses.a -I PDCurses -o cat-invaders.exe -static -luser32 -lgdi32 -ladvapi32 -lwinmm

      - name: Package
        run: |
          mkdir -p cat-invaders-windows
          cp cat-invaders.exe cat-invaders-windows/
          cp README.md cat-invaders-windows/
          zip -r cat-invaders-windows.zip cat-invaders-windows

      - uses: actions/upload-artifact@v4
        with:
          name: cat-invaders-windows
          path: |
            cat-invaders.exe
            cat-invaders-windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Build
        run: g++ main.cpp -o cat-invaders -lncurses

      - name: Package
        run: |
          mkdir -p cat-invaders-linux
          cp cat-invaders cat-invaders-linux/
          cp README.md cat-invaders-linux/
          chmod +x cat-invaders-linux/cat-invaders
          tar -czf cat-invaders-linux.tar.gz cat-invaders-linux

      - uses: actions/upload-artifact@v4
        with:
          name: cat-invaders-linux
          path: cat-invaders-linux.tar.gz
