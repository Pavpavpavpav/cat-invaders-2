name: build
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pdcurses
            zip
      - name: Build
        run: g++ main.cpp -o cat-invaders.exe -static -lpdcurses
      - name: Package
        run: |
          mkdir cat-invaders
          cp cat-invaders.exe cat-invaders/
          cp README.md cat-invaders/
          zip -r cat-invaders-windows.zip cat-invaders
      - uses: actions/upload-artifact@v4
        with:
          name: cat-invaders-windows
          path: |
            cat-invaders.exe
            cat-invaders-windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Build
        run: g++ main.cpp -o cat-invaders -lncurses
      - name: Package
        run: |
          mkdir cat-invaders
          cp cat-invaders cat-invaders/
          cp README.md cat-invaders/
          chmod +x cat-invaders/cat-invaders
          tar -czf cat-invaders-linux.tar.gz cat-invaders
      - uses: actions/upload-artifact@v4
        with:
          name: cat-invaders-linux
          path: cat-invaders-linux.tar.gz
